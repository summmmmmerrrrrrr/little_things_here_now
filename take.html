<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>little things — take a little thing</title>

  <!-- The site's font (Fragment Mono, from Google Fonts) - loaded once
       here per page; see --font-main in style.css for where it's applied. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap" rel="stylesheet">

  <!-- Shares the homepage's stylesheet (font, logo sizing/position
       variables) - see take.css for everything specific to this page.
       A fully separate file from about.css/interventions.css/
       collected.css - not shared - so nothing here can ever affect any
       of those pages, even though the heading/logo match them exactly. -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="take.css">
</head>
<body>

  <!-- Upper-right logo, same asset/size/position system as every other
       page - see #take-logo/#take-logo-link in take.css, which reuse
       style.css's --logo-margin/--logo-width. Clicking it restarts the
       whole site from the pigeon-opening scene (see take.js) - not
       just the plain navigation a link like this would otherwise be,
       since a stale "return to the open jar" flag (set when this page
       is reached from the jar's own portal-hand icon) would otherwise
       make the reloaded homepage jump straight back to the navigation
       state instead of genuinely restarting. -->
  <a id="take-logo-link" href="index.html" aria-label="little things here now - restart the site">
    <img id="take-logo" src="assets/images/little-things-logo.png" alt="little things here now" draggable="false">
  </a>

  <!-- Upper-left heading - returns directly to the homepage already in
       its finished "jar open" state (all four navigation objects out
       and settled) instead of replaying the pigeon/feather/wrestler
       sequence - see the "state=open-jar" handling in script.js,
       exactly matching the about page's/interventions page's/collected
       page's own heading behaviour. -->
  <a id="take-heading-link" href="index.html?state=open-jar" aria-label="back to little things here now, jar already open">
    <h1 id="take-heading">take a <span class="take-heading-line-2">little thing</span></h1>
  </a>

  <!-- The portal/hand composition - the jar/burning-heart/wounded-heart
       loop this page is actually about. Desktop/Mac layout only for
       now (see "DESKTOP / MAC ONLY" in take.css) - iPhone/iPad get
       their own pass later. "#take-portal-hand" never changes; only
       "#take-object" (which image, and its own position/size class -
       see take.css), "#take-description"'s text, and "#take-download"'s
       visibility change, all driven by take.js. Both images are purely
       decorative - "#take-description" right beside them already says
       what the object is. -->
  <div id="take-stage">
    <img id="take-portal-hand" src="assets/images/take-a-little-thing-portal-hand.png" alt="" draggable="false">
    <img id="take-object" class="take-object-jar" src="assets/images/take-jar.png" alt="" draggable="false">
  </div>

  <p id="take-description" aria-live="polite">you got
the little things jar paper model!</p>

  <!-- The one interaction on this page: clicking this cycles jar &#8594;
       burning heart &#8594; wounded heart &#8594; jar &#8594; ... (see take.js).
       Its own position never changes between states - see take.css. -->
  <p id="take-decline">i don&rsquo;t want this</p>

  <!-- Only visible in the jar state (see take.js) - links straight to
       the existing paper-model PDF, found in assets/take-downloads/.
       The two literal line breaks below (after "it" and after "own")
       are a no-op on desktop (plain "white-space: normal" there
       collapses each one to an ordinary space, same as before) -
       iPhone portrait's own "white-space: pre-line" (see take.css) is
       what turns them into actual forced breaks, matching the Figma
       reference there. -->
  <a id="take-download" href="assets/take-downloads/little-things-jar-paper-model.pdf" target="_blank" rel="noopener noreferrer">you can download it
and make your own
little things jar!</a>

  <script src="take.js"></script>
</body>
</html>
